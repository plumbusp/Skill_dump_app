<!DOCTYPE html>
<html>
<body>
    {% if for_idea %}
    <form action="/delete/{{ idea.id }}" method="post">
    <p>
      Are you sure you want to delete this idea? <br />
      <i>{{ idea.title }}</i>
    </p>
    <input type="submit" name="continue" value="Continue" />
    <input type="submit" name="cancel" value="Cancel" />
  </form>
    
  {% elif for_message %}
    <form action="/delete_message/{{ thread.id }}/{{ message.id }}" method="post">
      <p>
        Are you sure you want to delete this message? <br />
        <i>"{{ message.content }}"</i>
      </p>
      <input type="submit" name="continue" value="Continue" />
      <input type="submit" name="cancel" value="Cancel" />
    </form>
  {% endif %}

  </form>
</body>
</html>
