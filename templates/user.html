<!DOCTYPE html>
<html>
<head>
  <title>Profile of {user.usernames}:</title>
  <link rel="stylesheet" href="/static/main.css">
</head>

<body>
    <h1>Profile of {{user.usernames}}:</h1>
    {% if user.has_image %}
      <img src="/image/{{ user.id }}" />
    {% endif %}
    <h2> Last sent public ideas: </h2>
    {% for message in last_messages %}
        <p class = "accent_text"><i>{{message.sent_at}}</i></p>
        <p class = "message_island">{{message.content | show_lines}}</p>
    {% endfor %}
</body>

</html>
